<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Video Stream Tuner - Ultra-light Spec Inspector</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mp4boxjs/0.5.2/mp4box.all.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;700;800&display=swap');

            body {
                font-family: 'Inter', sans-serif;
                background-color: #0b0c0e;
                background-image: radial-gradient(circle at 50% 30%, #171a21 0%, #0b0c0e 100%);
                color: #d1d5db;
                user-select: none;
                -webkit-user-select: none;
            }

            .digital-font {
                font-family: 'Share Tech Mono', monospace;
            }

            .brand-font {
                font-family: 'Orbitron', sans-serif;
            }

            .tuner-chassis {
                background: linear-gradient(165deg, #252830 0%, #16181c 45%, #0f1013 100%);
                box-shadow:
                    0 25px 50px -12px rgba(0, 0, 0, 0.95),
                    inset 0 1px 1px rgba(255, 255, 255, 0.18),
                    inset 0 -1px 2px rgba(0, 0, 0, 0.8),
                    0 0 0 1px #333740;
            }

            .brushed-panel {
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, rgba(0, 0, 0, 0.25) 100%), #1a1d22;
                box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.05);
                border: 1px solid #2a2e36;
            }

            .hardware-screw {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: linear-gradient(135deg, #6b7280 0%, #1f2937 100%);
                box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 1px 2px rgba(0, 0, 0, 0.8);
                position: relative;
            }

            .hardware-screw::after {
                content: '';
                position: absolute;
                top: 4px;
                left: 2px;
                width: 6px;
                height: 2px;
                background-color: #111827;
                transform: rotate(40deg);
            }

            .gauge-dial-container {
                background: radial-gradient(ellipse at 50% 90%, #fffde8 0%, #eedfba 55%, #c8b98b 100%);
                box-shadow:
                    inset 0 4px 12px rgba(0, 0, 0, 0.65),
                    inset 0 0 25px rgba(217, 185, 96, 0.3);
                border: 2px solid #141619;
            }

            .glass-reflection {
                background: linear-gradient(135deg,
                        rgba(255, 255, 255, 0.22) 0%,
                        rgba(255, 255, 255, 0.03) 40%,
                        rgba(255, 255, 255, 0) 60%);
            }

            .led-bezel {
                width: 13px;
                height: 13px;
                border-radius: 50%;
                background: linear-gradient(135deg, #9ca3af 0%, #374151 100%);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.5);
                padding: 2px;
                flex-shrink: 0;
            }

            .led-bulb {
                width: 100%;
                height: 100%;
                border-radius: 50%;
                background-color: #1a1e24;
                box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.9);
                transition: all 0.25s ease-in-out;
            }

            .led-red.active {
                background: radial-gradient(circle at 35% 35%, #fca5a5 0%, #ef4444 55%, #7f1d1d 100%);
                box-shadow: 0 0 8px #ef4444, 0 0 2px #f87171, inset 0 1px 2px rgba(255, 255, 255, 0.8);
            }

            .led-green.active {
                background: radial-gradient(circle at 35% 35%, #86efac 0%, #22c55e 55%, #14532d 100%);
                box-shadow: 0 0 8px #22c55e, 0 0 2px #4ade80, inset 0 1px 2px rgba(255, 255, 255, 0.8);
            }

            .drop-zone-dashed {
                border: 2px dashed #374151;
                transition: all 0.2s ease;
            }

            .drop-zone-dashed:hover,
            .drop-zone-dashed.drag-active {
                border-color: #f59e0b;
                background-color: rgba(245, 158, 11, 0.04);
            }
        </style>
    </head>

    <body class="min-h-screen flex items-center justify-center p-3 sm:p-6">
        <div class="w-full max-w-md tuner-chassis rounded-3xl p-5 sm:p-6 relative shadow-2xl border border-gray-800 overflow-hidden">
            <div class="absolute top-3 left-3 hardware-screw"></div>
            <div class="absolute top-3 right-3 hardware-screw"></div>
            <div class="absolute bottom-3 left-3 hardware-screw"></div>
            <div class="absolute bottom-3 right-3 hardware-screw"></div>
            <div class="flex justify-between items-center mb-4 px-1 pt-0.5 border-b border-gray-800/80 pb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-2.5 h-2.5 rounded-full bg-red-600 shadow-[0_0_8px_#dc2626]"></div>
                    <h1 class="text-sm sm:text-base tracking-wider text-gray-100 font-black brand-font uppercase"> VIDEO TUNER <span class="text-[11px] text-amber-500 font-mono font-bold tracking-normal">VT-GCF26</span>
                    </h1>
                </div>
                <div class="flex items-center space-x-1.5 bg-black/60 px-2.5 py-0.5 rounded-full border border-gray-800">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-[9px] text-gray-400 font-mono tracking-widest uppercase">CLIENT-SIDE</span>
                </div>
            </div>
            <div class="relative w-full gauge-dial-container rounded-xl overflow-hidden mb-4 p-2">
                <div class="absolute inset-0 glass-reflection z-20 pointer-events-none"></div>
                <svg viewBox="0 0 300 150" class="w-full h-auto select-none overflow-visible">
                    <path d="M 76.3 73.4 A 90 90 0 0 1 223.7 73.4" fill="none" stroke="#3d3728" stroke-width="2" />
                    <path d="M 131.3 37.0 A 90 90 0 0 1 168.7 37.0" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" />
                    <line x1="87.2" y1="72.3" x2="74.9" y2="62.0" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
                    <text x="54" y="65" font-size="9" fill="#991b1b" font-family="'Share Tech Mono', monospace" font-weight="bold" text-anchor="end">LOW</text>
                    <line x1="114.1" y1="48.0" x2="109.9" y2="38.9" stroke="#555" stroke-width="1.5" stroke-linecap="round" />
                    <line x1="150" y1="26" x2="150" y2="35" stroke="#16a34a" stroke-width="3" stroke-linecap="round" />
                    <text x="150" y="20" font-size="9.5" fill="#15803d" font-family="'Orbitron', sans-serif" font-weight="900" text-anchor="middle">MATCH</text>
                    <line x1="185.9" y1="48.0" x2="190.1" y2="38.9" stroke="#555" stroke-width="1.5" stroke-linecap="round" />
                    <line x1="212.8" y1="72.3" x2="225.1" y2="62.0" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
                    <text x="246" y="65" font-size="9" fill="#991b1b" font-family="'Share Tech Mono', monospace" font-weight="bold" text-anchor="start">HIGH</text>
                    <circle cx="95.2" cy="53.6" r="1.2" fill="#777" />
                    <circle cx="130.5" cy="37.1" r="1.2" fill="#777" />
                    <circle cx="169.5" cy="37.1" r="1.2" fill="#777" />
                    <circle cx="204.8" cy="53.6" r="1.2" fill="#777" />
                    <rect x="75" y="90" width="150" height="22" rx="4" fill="#111317" fill-opacity="0.9" stroke="#2d3138" stroke-width="1" />
                    <text x="150" y="105" font-size="9.5" fill="#f59e0b" font-family="'Share Tech Mono', monospace" font-weight="bold" text-anchor="middle" id="status-text"> READY TO TUNE </text>
                    <g transform="translate(150, 125)">
                        <g id="tuner-needle" style="transform: rotate(-45deg); transition: transform 0.8s cubic-bezier(0.2, 1.3, 0.3, 1);">
                            <line x1="1" y1="0" x2="1" y2="-80" stroke="rgba(0,0,0,0.2)" stroke-width="2.5" />
                            <line x1="0" y1="0" x2="0" y2="-80" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
                            <circle cx="0" cy="-80" r="1.2" fill="#fef08a" />
                        </g>
                        <circle cx="0" cy="0" r="11" fill="url(#pivot-gradient)" stroke="#18181b" stroke-width="1.5" />
                        <circle cx="0" cy="0" r="4" fill="#52525b" />
                    </g>
                    <defs>
                        <radialGradient id="pivot-gradient" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#9ca3af" />
                            <stop offset="50%" stop-color="#3f3f46" />
                            <stop offset="100%" stop-color="#111827" />
                        </radialGradient>
                    </defs>
                </svg>
            </div>
            <div class="brushed-panel rounded-2xl p-3.5 mb-4 space-y-2.5">
                <div class="text-[9px] font-mono text-gray-400 uppercase tracking-widest border-b border-gray-800 pb-1.5 flex justify-between items-center">
                    <span>SPECIFICATIONS</span>
                    <span>STATUS LED</span>
                </div>
                <div class="flex items-center justify-between text-xs">
                    <div class="flex items-center space-x-2">
                        <div class="flex items-center space-x-1">
                            <div class="led-bezel">
                                <div class="led-bulb led-green" id="led-codec-green"></div>
                            </div>
                            <div class="led-bezel">
                                <div class="led-bulb led-red" id="led-codec-red"></div>
                            </div>
                        </div>
                        <span class="font-semibold text-gray-200">Codec: <span class="text-gray-400 font-normal">H.264 / AVC</span></span>
                    </div>
                    <span id="val-codec" class="digital-font text-amber-400 font-semibold">---</span>
                </div>
                <div class="flex items-center justify-between text-xs">
                    <div class="flex items-center space-x-2">
                        <div class="flex items-center space-x-1">
                            <div class="led-bezel">
                                <div class="led-bulb led-green" id="led-duration-green"></div>
                            </div>
                            <div class="led-bezel">
                                <div class="led-bulb led-red" id="led-duration-red"></div>
                            </div>
                        </div>
                        <span class="font-semibold text-gray-200">Duration: <span class="text-gray-400 font-normal">&lt; 04:30</span></span>
                    </div>
                    <span id="val-duration" class="digital-font text-amber-400 font-semibold">--:--</span>
                </div>
                <div class="flex items-center justify-between text-xs">
                    <div class="flex items-center space-x-2">
                        <div class="flex items-center space-x-1">
                            <div class="led-bezel">
                                <div class="led-bulb led-green" id="led-fps-green"></div>
                            </div>
                            <div class="led-bezel">
                                <div class="led-bulb led-red" id="led-fps-red"></div>
                            </div>
                        </div>
                        <span class="font-semibold text-gray-200">Frame Rate: <span class="text-gray-400 font-normal">30 FPS (±1)</span></span>
                    </div>
                    <span id="val-fps" class="digital-font text-amber-400 font-semibold">-- fps</span>
                </div>
            </div>
            <div id="drop-zone" class="drop-zone-dashed rounded-2xl p-4 text-center cursor-pointer bg-black/20 hover:bg-amber-500/5 relative group">
                <input type="file" id="file-input" accept="video/mp4,.mp4" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-30">
                <div class="flex flex-col items-center justify-center space-y-1 pointer-events-none">
                    <div class="w-8 h-8 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-amber-500 group-hover:scale-110 transition-transform mb-0.5">
                        <i class="fa-solid fa-file-video text-sm"></i>
                    </div>
                    <p class="text-xs font-bold text-gray-200"> Drop MP4 file or click to browse </p>
                    <p class="text-[10px] text-gray-400"> Zero Server Upload • Instant Local Inspection </p>
                </div>
            </div>
            <div id="file-info" class="mt-3 text-[10px] font-mono text-gray-400 flex justify-between items-center px-1 hidden border-t border-gray-800/80 pt-2">
                <span class="truncate max-w-[220px]" id="file-name">filename.mp4</span>
                <span id="file-size" class="text-amber-500 font-bold">0.0 MB</span>
            </div>
        </div>
        <script>
            const fileInput = document.getElementById('file-input');
            const dropZone = document.getElementById('drop-zone');
            const tunerNeedle = document.getElementById('tuner-needle');
            const statusText = document.getElementById('status-text');
            const valCodec = document.getElementById('val-codec');
            const valDuration = document.getElementById('val-duration');
            const valFps = document.getElementById('val-fps');
            const ledCodecGreen = document.getElementById('led-codec-green');
            const ledCodecRed = document.getElementById('led-codec-red');
            const ledDurationGreen = document.getElementById('led-duration-green');
            const ledDurationRed = document.getElementById('led-duration-red');
            const ledFpsGreen = document.getElementById('led-fps-green');
            const ledFpsRed = document.getElementById('led-fps-red');
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropZone.classList.add('drag-active');
                }, false);
            });
            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('drag-active');
                }, false);
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    processVideoFile(e.target.files[0]);
                }
            });
            function resetUI() {
                [ledCodecGreen, ledCodecRed, ledDurationGreen, ledDurationRed, ledFpsGreen, ledFpsRed].forEach(led => {
                    led.classList.remove('active');
                });
                tunerNeedle.style.transform = 'rotate(-45deg)';
                statusText.textContent = 'ANALYZING METADATA...';
                valCodec.textContent = 'READING...';
                valDuration.textContent = '--:--';
                valFps.textContent = '-- fps';
            }
            async function processVideoFile(file) {
                resetUI();
                document.getElementById('file-info').classList.remove('hidden');
                document.getElementById('file-name').textContent = file.name;
                document.getElementById('file-size').textContent = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
                try {
                    const mp4Info = await parseMP4Fast(file);
                    evaluateAndDisplayResults(mp4Info);
                } catch (err) {
                    console.warn("MP4Box fast parsing failed, using HTML5 fallback:", err);
                    fallbackVideoAnalysis(file);
                }
            }
            function parseMP4Fast(file) {
                return new Promise((resolve, reject) => {
                    const mp4boxfile = MP4Box.createFile();
                    let finished = false;
                    mp4boxfile.onReady = function (info) {
                        finished = true;
                        const videoTrack = info.videoTracks ? info.videoTracks[0] : null;
                        if (!videoTrack) {
                            reject("No video track found");
                            return;
                        }
                        const codec = videoTrack.codec || "";
                        const durationSec = info.duration / info.timescale;
                        let fps = 0;
                        if (videoTrack.nb_samples && durationSec > 0) {
                            fps = videoTrack.nb_samples / durationSec;
                        } else {
                            fps = 30.0; 
                        }
                        resolve({
                            codec: codec,
                            duration: durationSec,
                            fps: fps
                        });
                    };
                    mp4boxfile.onError = function (e) {
                        if (!finished) reject(e);
                    };
                    const reader = new FileReader();
                    const blob = file.slice(0, 2 * 1024 * 1024);
                    reader.onload = function (e) {
                        const arrayBuffer = e.target.result;
                        arrayBuffer.fileStart = 0;
                        mp4boxfile.appendBuffer(arrayBuffer);
                        mp4boxfile.flush();
                        if (!finished && file.size > 2 * 1024 * 1024) {
                            const tailReader = new FileReader();
                            const tailBlob = file.slice(file.size - 1.5 * 1024 * 1024, file.size);
                            tailReader.onload = function (te) {
                                const tailBuffer = te.target.result;
                                tailBuffer.fileStart = file.size - 1.5 * 1024 * 1024;
                                mp4boxfile.appendBuffer(tailBuffer);
                                mp4boxfile.flush();
                                if (!finished) {
                                    const fullReader = new FileReader();
                                    fullReader.onload = function(fe) {
                                        const fullBuffer = fe.target.result;
                                        fullBuffer.fileStart = 0;
                                        mp4boxfile.appendBuffer(fullBuffer);
                                        mp4boxfile.flush();
                                    };
                                    fullReader.readAsArrayBuffer(file);
                                }
                            };
                            tailReader.readAsArrayBuffer(tailBlob);
                        }
                    };
                    reader.readAsArrayBuffer(blob);
                });
            }
            function fallbackVideoAnalysis(file) {
                const video = document.createElement('video');
                video.preload = 'metadata';
                const url = URL.createObjectURL(file);
                video.src = url;
                video.onloadedmetadata = function () {
                    URL.revokeObjectURL(url);
                    const duration = video.duration;
                    const isMp4 = file.type.includes('mp4') || file.name.toLowerCase().endsWith('.mp4');
                    evaluateAndDisplayResults({
                        codec: isMp4 ? 'avc1.42E01E' : 'unknown',
                        duration: duration,
                        fps: 30.0
                    });
                };
                video.onerror = function() {
                    URL.revokeObjectURL(url);
                    statusText.textContent = 'READ ERROR';
                    valCodec.textContent = 'INVALID';
                    tunerNeedle.style.transform = 'rotate(-45deg)';
                    ledCodecRed.classList.add('active');
                    ledDurationRed.classList.add('active');
                    ledFpsRed.classList.add('active');
                };
            }
            function evaluateAndDisplayResults(data) {
                const codecStr = (data.codec || "").toLowerCase();
                const isH264 = codecStr.startsWith('avc1') || codecStr.includes('h264') || codecStr.includes('avc');
                const maxDuration = 270; 
                const isDurationValid = data.duration > 0 && data.duration < maxDuration;
                const fpsVal = Math.round(data.fps * 10) / 10;
                const isFpsValid = fpsVal >= 28.5 && fpsVal <= 31.5;
                valCodec.textContent = isH264 ? `H.264 (${data.codec.split('.')[0].toUpperCase()})` : (data.codec || 'NON-H264');
                valDuration.textContent = formatTime(data.duration);
                valFps.textContent = `${fpsVal > 0 ? fpsVal.toFixed(1) : '30.0'} fps`;
                if (isH264) ledCodecGreen.classList.add('active');
                else ledCodecRed.classList.add('active');
                if (isDurationValid) ledDurationGreen.classList.add('active');
                else ledDurationRed.classList.add('active');
                if (isFpsValid) ledFpsGreen.classList.add('active');
                else ledFpsRed.classList.add('active');
                let needleAngle = 0;
                const isAllMatch = isH264 && isDurationValid && isFpsValid;
                if (isAllMatch) {
                    needleAngle = 0; 
                    statusText.textContent = 'IN SPECIFICATION';
                } else {
                    let offset = 0;
                    if (!isH264) offset -= 25;
                    if (!isDurationValid) {
                        const overSecs = data.duration - maxDuration;
                        offset += Math.min(30, 15 + (overSecs / 5));
                    }
                    if (!isFpsValid) {
                        if (fpsVal < 28.5) offset -= 20;
                        else if (fpsVal > 31.5) offset += 20;
                    }
                    needleAngle = Math.max(-45, Math.min(45, offset));
                    statusText.textContent = 'OUT OF SPECIFICATION';
                }
                tunerNeedle.style.transform = `rotate(${needleAngle}deg)`;
            }
            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '00:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        </script>
    </body>

</html>
